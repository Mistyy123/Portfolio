<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mike Portfolio</title>

<style>

body{
    margin:0;
    background:#0e0e0e;
    font-family:Arial;
    color:white;
}

/* HLAVIČKA */
header{
    text-align:center;
    padding:50px 20px;
}

.logo{
    font-size:4rem;
    font-weight:bold;
}

.logo-orange{
    background:#ff6a00;
    color:black;
    padding:5px 15px;
    border-radius:8px;
}

.logo-dark{
    background:black;
    color:#ff6a00;
    padding:5px 15px;
    border-radius:8px;
}

/* TEXT POD LOGEM */
.sub{
    margin-top:20px;
    font-size:1.2rem;
    color:#cccccc;
}

/* PROJEKTY */
.projects{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
    padding:40px;
}

/* CARD */
.card{
    background:#1a1a1a;
    width:300px;
    padding:25px;
    border-radius:15px;
    transition:0.3s;
    border:1px solid #333;
}

/* HOVER */
.card:hover{
    transform:scale(1.05);
    border-color:#ff6a00;
}

/* NADPIS */
.card h2{
    color:#ff6a00;
}

/* TEXT */
.card p{
    color:#dddddd;
}

/* BUTTON */
.card a{
    display:inline-block;
    margin-top:15px;
    background:#ff6a00;
    color:black;
    padding:10px 20px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

.card a:hover{
    background:white;
}

/* MOBIL */
@media(max-width:700px){

.logo{
    font-size:2.5rem;
}

.projects{
    padding:20px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
<span class="logo-orange">MIKE</span>
<span class="logo-dark">HUB</span>
</div>

<p class="sub">
Web Developer • AI Tools • Game Developer
</p>

</header>

<section class="projects">

<div class="card">
<h2>Notes Manager</h2>

<p>
AI systém pro zapisování a správu poznámek.
</p>

<a href="#">
Otevřít
</a>
</div>

<div class="card">
<h2>AI Client</h2>

<p>
Vlastní AI klient s moderním designem.
</p>

<a href="#">
Otevřít
</a>
</div>

<div class="card">
<h2>BoxHub</h2>

<p>
Boxerský web vytvořený v HTML a CSS.
</p>

<a href="#">
Otevřít
</a>
</div>

</section>

</body>
</html>
